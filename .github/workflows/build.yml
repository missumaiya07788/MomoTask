name: MOMOTASK Android Setup

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter project
        run: |
          mkdir -p /tmp/momotask_source
          unzip -q MOMOTASK_Flutter_Prototype.zip -d /tmp/momotask_source
          PUBSPEC=$(find /tmp/momotask_source -name pubspec.yaml -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml was not found in the ZIP file."
            exit 1
          fi
          SOURCE_DIR=$(dirname "$PUBSPEC")
          cp -R "$SOURCE_DIR"/. .

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.sumaiya.momotask --project-name momotask .
    
      - name: Add Firebase configuration files
        run: |
          mkdir -p android/app/src/admin
          mkdir -p android/app/src/student
          cp google-services.json android/app/src/admin/google-services.json
          cp google-services-student.json android/app/src/student/google-services.json
   
      - name: Fix Flutter code issues
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path("lib/main.dart")
          if main.exists():
              code = main.read_text()
              code = code.replace("cardTheme: CardTheme(", "cardTheme: CardThemeData(")
              main.write_text(code)

          test_file = Path("test/widget_test.dart")
          if test_file.exists():
              code = test_file.read_text()
              code = code.replace("MyApp", "MomoTaskApp")
              test_file.write_text(code)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Check Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Check Android files
        run: |
          echo "Android app files:"
          ls -la android/app/
          cat android/app/build.gradle.kts
          echo "ANDROID SETTINGS:"
          cat android/settings.gradle.kts
